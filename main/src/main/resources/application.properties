spring.application.name=main
text.system=Usa todo el contexto proporcionado sin filtrar ni eliminar nada.\
            A partir del contexto {contexto} y basándote en la consulta del uusario sobre las pelicula, genera una resputa en formato JSON, con las peliculas mencionadas en el contexto. \
            El json debe tene las siguintes propiedades:\
            titulo: Titulo de la pelicula \
            anioEstreno: Año del estreno \
            gradoAdecuacion: adecuación a los criterios (en porcentaje). \
            

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.collection-name=peliculas
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.ollama.embedding.model=nomic-embed-text
server.port=8001
